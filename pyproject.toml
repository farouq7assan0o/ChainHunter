[project]
name = "chainhunter"
version = "0.5.0"
description = "Correlated attack-chain detection for Windows logs: Sigma, sequences, UEBA, risk-based alerting, telemetry blind-spot analysis, DuckDB scale layer."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
evtx = ["python-evtx>=0.8"]
lake = ["duckdb>=1.1"]
ai = ["anthropic"]
dev = ["pytest>=8", "duckdb>=1.1"]

[project.scripts]
chainhunter = "chainhunter.cli:main"

[tool.setuptools]
packages = ["chainhunter"]
