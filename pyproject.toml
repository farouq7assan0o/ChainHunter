[project]
name = "chainhunter"
version = "0.2.0"
description = "Correlated attack-chain detection for Windows logs: Sigma, sequences, UEBA, risk-based alerting."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
evtx = ["python-evtx>=0.8"]
dev = ["pytest>=8"]

[project.scripts]
chainhunter = "chainhunter.cli:main"

[tool.setuptools]
packages = ["chainhunter"]
