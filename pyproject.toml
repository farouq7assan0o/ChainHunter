[project]
name = "chainhunter"
version = "0.1.0"
description = "Turn Windows logs into correlated attack chains, ATT&CK layers and a CDSA-style incident report."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
evtx = ["python-evtx>=0.8"]
dev = ["pytest>=8"]

[project.scripts]
chainhunter = "chainhunter.cli:main"

[tool.setuptools]
packages = ["chainhunter"]
