title: Account Used from Unmanaged Host Then Requests Directory Replication
id: ch-s003
status: experimental
description: >
  Link an account's NTLM logon from an unmanaged workstation to that same account exercising
  directory replication rights — domain credential theft by an external operator.
tags: [attack.lateral_movement, attack.t1078, attack.credential_access, attack.t1003.006]
level: critical
sequence:
  within_seconds: 14400
  steps:
    - id: logon
      rule: ch-0003
    - id: dcsync
      rule: ch-0004
  join:
    - [logon.actor, dcsync.actor]
chainhunter:
  kill_chain: Impact
tests:
  match:
    - - {EventID: 4624, LogonType: 3, AuthenticationPackageName: NTLM, WorkstationName: kali, TargetUserName: mallory, IpAddress: 10.1.1.1, Computer: dc01, _offset: 0}
      - {EventID: 4662, SubjectUserName: mallory, Properties: "{1131f6ad-9c07-11d1-f79f-00c04fc2dcd2}", Computer: dc01, _offset: 3000}
  nomatch:
    - - {EventID: 4624, LogonType: 3, AuthenticationPackageName: NTLM, WorkstationName: kali, TargetUserName: mallory, IpAddress: 10.1.1.1, Computer: dc01, _offset: 0}
      - {EventID: 4662, SubjectUserName: mallory, Properties: "{1131f6ad-9c07-11d1-f79f-00c04fc2dcd2}", Computer: dc01, _offset: 30000}
