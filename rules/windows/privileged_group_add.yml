title: Member Added to Privileged Group
id: ch-0005
status: experimental
description: >
  Identify accounts added to highly privileged security groups, a common persistence and privilege
  escalation step after credential compromise.
tags: [attack.persistence, attack.privilege_escalation, attack.t1098]
level: high
logsource: {product: windows, service: security}
detection:
  selection:
    EventID: [4728, 4732, 4756]
    TargetUserName: [Domain Admins, Enterprise Admins, Administrators, Schema Admins]
  condition: selection
chainhunter:
  kill_chain: Privilege Escalation
  actor_field: SubjectUserName
  source_field: MemberName
  queries:
    kql: 'event.code:(4728 or 4732 or 4756) and winlog.event_data.TargetUserName:("Domain Admins" or "Enterprise Admins" or "Administrators")'
    spl: 'index=wineventlog EventCode IN (4728,4732,4756) Group_Name IN ("Domain Admins","Enterprise Admins","Administrators") | table _time host src_user Member_Name Group_Name'
