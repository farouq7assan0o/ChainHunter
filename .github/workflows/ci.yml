name: detections-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,evtx]"
      - name: Validate rules (lint + embedded tests)
        run: chainhunter validate -v --navigator coverage_layer.json
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Hunt demo dataset
        run: |
          python samples/make_demo.py
          chainhunter hunt samples/goad_demo.jsonl -o out
      - name: Benchmark on real attack recordings (fetched, sha256-verified)
        run: |
          python datasets/fetch.py --skip-campaigns
          chainhunter bench -o out/bench.md
          cat out/bench.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compile rules
        run: |
          chainhunter convert --to kql > out/rules.kql
          chainhunter convert --to eql > out/rules.eql
          chainhunter convert --to spl > out/rules.spl
      - uses: actions/upload-artifact@v4
        with:
          name: chainhunter-report
          path: |
            out/
            coverage_layer.json
